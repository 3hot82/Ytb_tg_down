services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    profiles:
      - local-api
    env_file: .env
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_STAT: "0"
      TELEGRAM_VERBOSITY: "2"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - downloads:/app/downloads
    ports:
      - "127.0.0.1:${TELEGRAM_BOT_API_PORT:-8081}:8081"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ytdlp-bin:/opt/ytdlp
      - cookies-data:/app/data
      - browser-profile:/browser-profile:ro
    command: ["python", "-m", "app.bot"]

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    volumes:
      - downloads:/app/downloads
      - ytdlp-bin:/opt/ytdlp
      - cookies-data:/app/data
    command: ["python", "-m", "app.worker"]

  watcher:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ytdlp-bin:/opt/ytdlp
      - cookies-data:/app/data
    command: ["python", "-m", "app.watcher"]

  auth-browser:
    image: lscr.io/linuxserver/chromium:${AUTH_BROWSER_IMAGE_TAG:-kasm}
    restart: unless-stopped
    profiles:
      - auth
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Krasnoyarsk
      - CUSTOM_USER=${AUTH_BROWSER_USER:-admin}
      - PASSWORD=${AUTH_BROWSER_PASSWORD:-change-me}
      - CHROME_CLI=https://www.instagram.com/
    volumes:
      - browser-profile:/config
    ports:
      - "127.0.0.1:${AUTH_BROWSER_PORT:-33000}:3000"

volumes:
  redis-data:
  downloads:
  ytdlp-bin:
  cookies-data:
  browser-profile:
  telegram-bot-api-data:
